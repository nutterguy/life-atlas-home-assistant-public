name: Build WhatsApp Archive image

on:
  push:
    branches: [main]
    paths: ["whatsapp_archive/**", ".github/workflows/build-whatsapp-archive.yml"]
  pull_request:
    paths: ["whatsapp_archive/**", ".github/workflows/build-whatsapp-archive.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      url: ${{ steps.info.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./whatsapp_archive
      - id: normalize
        env:
          RAW_VERSION: ${{ steps.info.outputs.version }}
        run: echo "version=${RAW_VERSION//\"/}" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s whatsapp_archive/tests

  build:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./whatsapp_archive
          image: ghcr.io/nutterguy/${{ matrix.arch }}-life-atlas-whatsapp-archive
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          version: ${{ needs.prepare.outputs.version }}

  result:
    needs: [prepare, validate, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREPARE: ${{ needs.prepare.result }}
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          printf 'WHATSAPP_ARCHIVE_IMAGE={"version":"%s","prepare":"%s","validate":"%s","build":"%s","sha":"%s"}\n' "$VERSION" "$PREPARE" "$VALIDATE" "$BUILD" "$GITHUB_SHA"
          test "$PREPARE" = "success"
          test "$VALIDATE" = "success"
          test "$BUILD" = "success"
