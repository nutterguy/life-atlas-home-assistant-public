name: "Life Atlas"
description: "A private, personal life timeline inside Home Assistant"
version: "0.15.0"
slug: "life_atlas"
url: "https://github.com/nutterguy/life-atlas-home-assistant-public"
init: false
arch:
  - amd64
image: "ghcr.io/nutterguy/life-atlas-home-assistant"
startup: application
boot: auto
backup: cold
backup_exclude:
  - "whatsapp/waha/noweb/*/store.sqlite3*"
ingress: true
ingress_port: 8099
panel_icon: "mdi:map-marker-path"
panel_title: "Life Atlas"
homeassistant_api: false
host_network: false
ports:
  8096/tcp: 8096
ports_description:
  8096/tcp: "Life Atlas private agent API"
options:
  agent_api_key: ""
  whatsapp_session_name: "life-atlas"
  whatsapp_reconcile_seconds: 300
  whatsapp_full_rescan_hours: 24
  whatsapp_history_page_size: 500
schema:
  agent_api_key: "password?"
  google_photos_mcp_client_id: "str?"
  google_photos_mcp_client_secret: "password?"
  google_photos_mcp_redirect_uri: "url?"
  whatsapp_session_name: "match(^[a-zA-Z0-9_-]{1,64}$)"
  whatsapp_reconcile_seconds: "int(30,3600)"
  whatsapp_full_rescan_hours: "int(1,168)"
  whatsapp_history_page_size: "int(50,1000)"
