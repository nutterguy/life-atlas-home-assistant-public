<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Atlas</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="detail.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="v2-bars.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="v3.css"><link rel="stylesheet" href="v4.css"><link rel="stylesheet" href="v5.css"><link rel="stylesheet" href="v6.css"><link rel="stylesheet" href="v7.css"><link rel="stylesheet" href="v8.css"><link rel="stylesheet" href="v9.css"></head>
<body>
<aside id="sidebar"><button id="sidebar-pin" title="Keep sidebar open">☰</button><div class="brand"><span>Life Atlas</span> <small>Brendon</small></div><nav id="nav"></nav><div class="side-tools"><button class="primary" id="add"><span class="tool-icon">＋</span><span class="tool-label">Add event</span></button><button id="backup"><span class="tool-icon">⤓</span><span class="tool-label">Back up</span></button><button id="export"><span class="tool-icon">↗</span><span class="tool-label">Export CSV</span></button></div><div class="privacy">Private and local<br><span id="count"></span><br><span id="app-version"></span></div></aside>
<main><header><div><h1 id="view-title">Timeline</h1><p id="subtitle">Your life, backed by evidence.</p></div></header>
<section class="filters"><input id="search" placeholder="Search events, places or people"><select id="status"><option value="">All attendance states</option><option>confirmed</option><option>booked</option><option>planned</option><option>cancelled</option><option>resold</option><option>uncertain</option></select><select id="category"><option value="">All categories</option></select></section>
<section id="content"></section></main>
<dialog id="event-dialog"><form id="event-form"><button type="button" class="close">×</button><h2>Add a life event</h2><label>Title<input name="title" required></label><div class="grid2"><label>Start date<input type="date" name="start_date" required></label><label>End date<input type="date" name="end_date"></label></div><div class="grid2"><label>Category<input name="category" value="Life"></label><label>Attendance state<select name="status"><option>confirmed</option><option>booked</option><option>planned</option><option>cancelled</option><option>resold</option><option>uncertain</option></select></label></div><label>Confidence<input type="range" min="0" max="1" step=".05" name="confidence" value=".8"></label><label>Notes<textarea name="description"></textarea></label><button class="primary" type="submit">Save event</button></form></dialog>
<dialog id="detail-dialog" class="detail-dialog"><button type="button" class="close detail-close">×</button><div id="detail-content"></div></dialog>
<dialog id="review-dialog"><form id="review-form"><button type="button" class="close review-close">×</button><h2>Resolve attendance</h2><p id="review-question"></p><input type="hidden" name="review_id"><label>What happened?<select name="outcome"><option value="attended">Yes, I attended</option><option value="did_not_attend">No, I did not attend</option><option value="resold">I resold or transferred it</option><option value="still_uncertain">I am still not sure</option></select></label><button class="primary">Save decision</button></form></dialog>
<dialog id="edit-dialog" class="detail-dialog"><button type="button" class="close edit-close">×</button><div id="edit-content"></div></dialog>
<input id="photo-file" type="file" accept="image/*" hidden>
<div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js?v=alpha10"></script><script src="photo-tools.js?v=1"></script><script src="runtime-meta.js?v=1"></script></body></html>
